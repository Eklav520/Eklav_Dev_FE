    <g transform="translate(44,72)">
      <circle r="26" fill="none" stroke="#0b3d91" stroke-width="2.2"/>
      <circle r="3" fill="#0b3d91"/>
      <g stroke="#0b3d91" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="-24"/><line x1="0" y1="0" x2="10.4" y2="-21.7"/>
        <line x1="0" y1="0" x2="18.7" y2="-15.1"/><line x1="0" y1="0" x2="23.5" y2="-6.2"/>
        <line x1="0" y1="0" x2="23.5" y2="6.2"/><line x1="0" y1="0" x2="18.7" y2="15.1"/>
        <line x1="0" y1="0" x2="10.4" y2="21.7"/><line x1="0" y1="0" x2="0" y2="24"/>
        <line x1="0" y1="0" x2="-10.4" y2="21.7"/><line x1="0" y1="0" x2="-18.7" y2="15.1"/>
        <line x1="0" y1="0" x2="-23.5" y2="6.2"/><line x1="0" y1="0" x2="-23.5" y2="-6.2"/>
        <line x1="0" y1="0" x2="-18.7" y2="-15.1"/><line x1="0" y1="0" x2="-10.4" y2="-21.7"/>
      </g>
    </g>

    <g text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
