    <text x="800" y="70" font-size="20" font-weight="800" letter-spacing="6" fill="#ff7a00">— HAPPY —</text>
    <text x="800" y="112" font-size="44" font-weight="900" letter-spacing="2" fill="#102d59">INDEPENDENCE DAY</text>
    <text x="800" y="140" font-size="17" fill="#475569">Let's build a smarter tomorrow</text>
    <text x="800" y="164" font-size="16" font-weight="700">
      <tspan fill="#ff7a00">Proud to be Indian.</tspan>
      <tspan fill="#138808"> Proud to learn.</tspan>
    </text>
  </g>

  <!-- Coupon ticket -->
  <g transform="translate(1260,38)">
    <rect x="0" y="0" width="300" height="144" rx="16" fill="#ffffff" stroke="#ff9933" stroke-width="2.5" stroke-dasharray="6 5"/>
    <circle cx="0" cy="72" r="12" fill="#fffaf2" stroke="#ff9933" stroke-width="2.5"/>
    <circle cx="300" cy="72" r="12" fill="#fffaf2" stroke="#ff9933" stroke-width="2.5"/>

