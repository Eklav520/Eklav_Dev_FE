      <text x="190" y="48" font-size="12" fill="#64748b">Use Coupon</text>
      <text x="190" y="80" font-size="30" font-weight="900" fill="#102d59">EKLAV<tspan fill="#ff7a00">70</tspan></text>
      <g transform="translate(130,96)">
        <polygon points="8,0 172,0 180,20 172,40 8,40 0,20" fill="url(#badgeGrad)"/>
        <text x="90" y="26" font-size="13" font-weight="800" fill="#ffffff">FLAT 70% OFF</text>
      </g>
